# GitHub'ın kendi güvenlik taraması (CodeQL): kodda bilinen güvenlik açığı kalıplarını arar.
# Sonuçlar GitHub'da Security > Code scanning altında görünür; derlemeyi durdurmaz.
name: Security scan
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
      # Bulguların kopyası (inceleme için 7 gün saklanır)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 7
  # Kullanılan paketlerde bilinen açıklar (Dependabot ile aynı veritabanı); derlemeyi durdurmaz.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (web ve mobil)
        run: |
          npm audit --package-lock-only --json > web-audit.json || true
          (cd mobile && npm audit --package-lock-only --json > ../mobile-audit.json || true)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: '*-audit.json'
          retention-days: 7
