# GitHub'ın kendi güvenlik taraması (CodeQL): kodda bilinen güvenlik açığı kalıplarını arar.
# Sonuçlar GitHub'da Security > Code scanning altında görünür; derlemeyi durdurmaz.
name: Security scan
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
