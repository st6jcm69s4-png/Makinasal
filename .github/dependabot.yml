# Yalnızca GÜVENLİK güncellemeleri: sürüm yükseltme istekleri kapalı (open-pull-requests-limit: 0),
# çünkü Expo paketleri birbirine bağlı sürümlerle çalışır ve rastgele yükseltme uygulamayı bozar.
# Güvenlik açığı bulunan paketler için Dependabot yine de düzeltme isteği açar.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: "/mobile"
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
